<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="768" viewBox="0 0 1040 768" role="img" aria-labelledby="allocation-en-title allocation-en-desc"><title id="allocation-en-title">At most 6 tokens in a 10s window</title><desc id="allocation-en-desc">For one resource capped at six grants in any ten seconds, active A, B, C receive ABCABC; with C idle, A and B receive ABABAB. All wait when quota is exhausted.</desc><rect width="1040" height="768" fill="#f5f5f5"/><g font-family="Geist, -apple-system, BlinkMacSystemFont, Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="32" font-weight="600" fill="#2d3142" text-anchor="start">At most 6 tokens in a 10s window</text><text x="40" y="96" font-size="20" font-weight="400" fill="#2d3142" text-anchor="start">Machines A, B and C share one token bucket.</text><text x="40" y="128" font-size="20" font-weight="400" fill="#4f5d75" text-anchor="start">1 token = permission to execute 1 operation</text><text x="40" y="184" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">1. A, B and C all request tokens</text><text x="40" y="216" font-size="20" font-weight="400" fill="#4f5d75" text-anchor="start">Waiting order A → B → C; new ready work rejoins the tail.</text><rect x="40" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="112" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 1</text><text x="112" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To A</text><rect x="200" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="272" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 2</text><text x="272" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To B</text><rect x="360" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="432" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 3</text><text x="432" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To C</text><rect x="520" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="592" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 4</text><text x="592" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To A</text><rect x="680" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="752" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 5</text><text x="752" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To B</text><rect x="840" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="912" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 6</text><text x="912" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To C</text><text x="40" y="360" font-size="20" font-weight="600" fill="#2d3142" text-anchor="start">Result: A gets 2, B gets 2, C gets 2.</text><text x="40" y="416" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">2. Only A and B request tokens</text><text x="40" y="448" font-size="20" font-weight="400" fill="#4f5d75" text-anchor="start">A and B keep requesting and take turns receiving all 6 tokens.</text><rect x="784" y="388" width="216" height="72" rx="8" fill="#ececec" stroke="#bfc0c0"/><text x="892" y="416" font-size="20" font-weight="600" fill="#4f5d75" text-anchor="middle">C: no ready work</text><text x="892" y="444" font-size="20" font-weight="400" fill="#4f5d75" text-anchor="middle">No token requests</text><rect x="40" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="112" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 1</text><text x="112" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To A</text><rect x="200" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="272" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 2</text><text x="272" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To B</text><rect x="360" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="432" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 3</text><text x="432" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To A</text><rect x="520" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="592" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 4</text><text x="592" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To B</text><rect x="680" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="752" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 5</text><text x="752" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To A</text><rect x="840" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="912" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">Token 6</text><text x="912" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">To B</text><text x="40" y="592" font-size="20" font-weight="600" fill="#2d3142" text-anchor="start">Result: A and B get 3 each. No tokens are reserved for C.</text><rect x="40" y="620" width="960" height="64" rx="8" fill="#fff1e9" stroke="#eb6c36"/><text x="64" y="660" font-size="20" font-weight="600" fill="#2d3142" text-anchor="start">Window quota exhausted → everyone waits → resume in queue order when quota is available</text><text x="40" y="720" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="start">Assumes ready clients keep retrying, renew leases and promptly rejoin for new work.</text><text x="40" y="744" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="start">Left to right shows grant order, not equal time steps or a fixed-window reset.</text></g></svg>
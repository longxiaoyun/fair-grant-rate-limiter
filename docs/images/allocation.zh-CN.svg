<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="768" viewBox="0 0 1040 768" role="img" aria-labelledby="allocation-zh-CN-title allocation-zh-CN-desc"><title id="allocation-zh-CN-title">同一份令牌，怎样公平分给多台机器？</title><desc id="allocation-zh-CN-desc">同一资源任意10秒最多6个令牌。A、B、C都持续等待时按ABCABC发放；C无任务时按ABABAB发放。六个用完后等待额度恢复。</desc><rect width="1040" height="768" fill="#f5f5f5"/><g font-family="Geist, -apple-system, BlinkMacSystemFont, Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="56" font-size="32" font-weight="600" fill="#2d3142" text-anchor="start">同一份令牌，怎样公平分给多台机器？</text><text x="40" y="96" font-size="20" font-weight="400" fill="#2d3142" text-anchor="start">示例：同一资源，所有机器合计，任意 10 秒最多发放 6 个令牌。</text><text x="40" y="128" font-size="20" font-weight="400" fill="#4f5d75" text-anchor="start">1 个令牌 = 执行 1 次任务的机会</text><text x="40" y="184" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">① A、B、C 都有任务：依次轮流获取</text><text x="40" y="216" font-size="20" font-weight="400" fill="#4f5d75" text-anchor="start">等待顺序 A → B → C；拿到后，有新任务就排到队尾。</text><rect x="40" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="112" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 1 个令牌</text><text x="112" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 A</text><rect x="200" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="272" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 2 个令牌</text><text x="272" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 B</text><rect x="360" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="432" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 3 个令牌</text><text x="432" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 C</text><rect x="520" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="592" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 4 个令牌</text><text x="592" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 A</text><rect x="680" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="752" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 5 个令牌</text><text x="752" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 B</text><rect x="840" y="240" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="912" y="268" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 6 个令牌</text><text x="912" y="304" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 C</text><text x="40" y="360" font-size="20" font-weight="600" fill="#2d3142" text-anchor="start">结果：A 得 2 个，B 得 2 个，C 得 2 个。</text><text x="40" y="416" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">② C 没有任务：令牌继续分给 A、B</text><text x="40" y="448" font-size="20" font-weight="400" fill="#4f5d75" text-anchor="start">C 不参与排队，不会占用或预留额度。</text><rect x="40" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="112" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 1 个令牌</text><text x="112" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 A</text><rect x="200" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="272" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 2 个令牌</text><text x="272" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 B</text><rect x="360" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="432" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 3 个令牌</text><text x="432" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 A</text><rect x="520" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="592" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 4 个令牌</text><text x="592" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 B</text><rect x="680" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="752" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 5 个令牌</text><text x="752" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 A</text><rect x="840" y="472" width="144" height="88" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="912" y="500" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="middle">第 6 个令牌</text><text x="912" y="536" font-size="28" font-weight="600" fill="#2d3142" text-anchor="middle">给 B</text><text x="40" y="592" font-size="20" font-weight="600" fill="#2d3142" text-anchor="start">结果：A 得 3 个，B 得 3 个，C 得 0 个。</text><rect x="40" y="620" width="960" height="64" rx="8" fill="#fff1e9" stroke="#eb6c36"/><text x="64" y="660" font-size="20" font-weight="600" fill="#2d3142" text-anchor="start">窗口内已发满 6 个 → 所有机器等待 → 额度恢复后按队列继续发放</text><text x="40" y="720" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="start">前提：有任务的机器持续重试、续租，并及时为下一项任务排队。</text><text x="40" y="744" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="start">横向表示发放顺序，不表示等间隔时间；窗口配额不会在固定时刻整批重置。</text></g></svg>